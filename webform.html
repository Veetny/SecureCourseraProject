<!DOCTYPE html>
<html>
<head>
    <title>SafeVault Registration</title>
</head>

<body>

    <h2>Create a SafeVault Account</h2>

    <form action="/submit" method="post">

        <label for="username">Username:</label>
        <input type="text"
               id="username"
               name="username"
               maxlength="30"
               required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               maxlength="100"
               required>

        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
